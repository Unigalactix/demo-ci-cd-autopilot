name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the form below to help us understand your request.
  
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you'd like to see.
      placeholder: Describe the feature...
    validations:
      required: true
  
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is your feature request related to a problem?
      placeholder: I'm frustrated when... / This would help with...
    validations:
      required: true
  
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: Describe how this feature should work...
    validations:
      required: true
  
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: What other approaches have you thought about?
    validations:
      required: false
  
  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe specific use cases or scenarios where this feature would be beneficial.
      placeholder: |
        1. When ...
        2. For users who ...
        3. In scenarios where ...
    validations:
      required: false
  
  - type: textarea
    id: validation-steps
    attributes:
      label: Validation Steps
      description: How can we verify that this feature works as expected once implemented?
      placeholder: |
        1. Test by...
        2. Verify that...
        3. Ensure that...
    validations:
      required: false
  
  - type: textarea
    id: ci-considerations
    attributes:
      label: CI/CD Considerations
      description: Are there any CI/CD, deployment, or automation considerations for this feature?
      placeholder: Impact on builds, tests, deployments, or infrastructure?
    validations:
      required: false
  
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve workflow
        - High - Critical for my use case
    validations:
      required: false
  
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request.
      placeholder: Any other information, links, or examples that might be helpful
    validations:
      required: false
