name: CI Pipeline - Unigalactix/demo-ci-cd-autopilot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CI: true

jobs:
  # --- JOB 1: BUILD & TEST ---
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js for the project
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the application
      - name: Build
        run: npm run build

      # Run tests
      - name: Test
        run: npm test

  # --- JOB 2: SECURITY SCANS ---
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # --- JOB 3: CONTAINERIZATION (Conditional) ---
  docker-build:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: ${{ secrets.ACR_LOGIN_SERVER && secrets.ACR_USERNAME && secrets.ACR_PASSWORD }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase repo name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:${{ github.sha }}

  # --- JOB 4: DEPLOYMENT (Conditional) ---
  deploy:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE && secrets.AZURE_WEBAPP_APP_NAME }}
    environment: Production
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js for deployment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install production dependencies
      - name: Install dependencies
        run: npm ci --only=production

      # Validate deployment package
      - name: Validate deployment package
        run: |
          if [ ! -f "index.js" ]; then
            echo "Error: index.js not found"
            exit 1
          fi
          if [ ! -f "public/index.html" ]; then
            echo "Error: public/index.html not found"
            exit 1
          fi
          echo "Deployment package validated successfully"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: '${{ secrets.AZURE_WEBAPP_APP_NAME }}'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
          slot-name: ${{ secrets.AZURE_WEBAPP_SLOT_NAME }}
