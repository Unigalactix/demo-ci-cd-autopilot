name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # --- JOB 1: BUILD AND TEST ---
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the application
      - name: Build
        run: npm run build

      # Run tests
      - name: Test
        run: npm test

      # Upload job logs as artifacts for debugging
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

  # --- JOB 2: SECURITY SCANS ---
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # --- JOB 3: CONTAINERIZATION (Conditional) ---
  docker-build:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    # FIXED: Removed the invalid 'if: secrets...' check here
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase repo name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Azure Container Registry
        # ADDED: Check for secret existence here
        if: secrets.ACR_LOGIN_SERVER != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        # ADDED: Check for secret existence here
        if: secrets.ACR_LOGIN_SERVER != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:${{ github.sha }}

  # --- JOB 4: DEPLOYMENT (Conditional) ---
  deploy:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    # FIXED: Removed the invalid 'if: secrets...' check here
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Azure Web App
        # ADDED: Check for secret existence here
        if: secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v2
        with:
          app-name: '${{ secrets.AZURE_WEBAPP_APP_NAME }}'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
          slot-name: ${{ secrets.AZURE_WEBAPP_SLOT_NAME }}
